name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Format check, unit tests, Testcontainers integration tests (the runner has Docker), JaCoCo reports.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/site/jacoco-it/
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          {
            echo "### Test results"
            for f in target/surefire-reports/*.txt target/failsafe-reports/*.txt; do
              if [ -f "$f" ]; then grep -h "Tests run" "$f" || true; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image and smoke test
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE: aviation-api:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Built once and loaded locally; the smoke test runs exactly this image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack the way the README does
        run: scripts/run.sh --no-build

      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8081/actuator/health/readiness
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/airports/KJ%2A)
          echo "Malformed code returned $status"
          test "$status" = "400"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
