# Used in the container. Actuator moves to its own port, which Compose binds to 127.0.0.1 only.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  structured:
    format:
      console: ecs
